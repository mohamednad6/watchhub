<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime — Watch Hub</title>
  <meta name="description" content="Browse and discover anime on Watch Hub.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="anime">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Watch<span>Hub</span></a>
      <button id="navToggle" class="nav-toggle" type="button" aria-label="Menu">☰</button>
      <nav id="navLinks" class="nav-links" hidden>
        <a href="index.html" data-nav="home">Home</a>
        <a href="movies.html" data-nav="movies">Movies</a>
        <a href="series.html" data-nav="series">Series</a>
        <a href="anime.html" data-nav="anime">Anime</a>
        <a href="watchlist.html" data-nav="watchlist">Watchlist</a>
      </nav>
      <div class="header-tools">
        <input id="searchInput" type="search" placeholder="Search movies, series, anime…" aria-label="Search">
        <button id="themeBtn" class="tool-btn" type="button" title="Toggle theme">◐</button>
        <button id="langBtn" class="tool-btn" type="button" title="Toggle language">EN</button>
        <button id="installBtn" class="tool-btn install" type="button" hidden>Install</button>
        <a class="auth-signin" id="signInLink" href="login.html" hidden>Sign In</a>
        <div class="auth-user" id="authUser" hidden>
          <img class="auth-avatar" id="authAvatar" alt="" width="32" height="32" hidden>
          <span class="auth-avatar auth-initial" id="authInitial" hidden></span>
          <span class="auth-name" id="authName"></span>
          <button class="tool-btn" id="signOutBtn" type="button">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="page-head">
      <h1>Anime</h1>
      <span id="resultCount" class="result-count"></span>
    </div>
    <div id="genrePills" class="genre-pills"></div>
    <div class="controls">
      <label class="control">Sort
        <select id="sortSelect">
          <option value="popularity.desc">Most popular</option>
          <option value="vote_average.desc">Top rated</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </label>
      <label class="control">Year
        <select id="yearSelect"><option value="">All years</option></select>
      </label>
    </div>
    <section id="grid" class="grid"></section>
    <div id="sentinel" class="sentinel"></div>
  </main>

  <footer class="site-footer">
    <p>This product uses the TMDB API but is not endorsed or certified by
      <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>
  <button id="backTop" class="back-top" type="button" aria-label="Back to top" hidden>↑</button>

  <script defer src="common.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="page.js"></script>
  <script defer src="nav.js"></script>
</body>
</html>
